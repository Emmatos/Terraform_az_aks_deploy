
name: 'Terraform infrastructure Deployment to Azure Cloud'

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  terraform:
    name: 'TerraformAzureCloud'
    runs-on: ubuntu-latest
    environment: dev

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

     
      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        env:
          TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          TF_VAR_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # Terraform Destroy is intentionally disabled.
      # Use a separate, manually controlled process when needed.

      - name: Slack - Deployment Succeeded
        if: success()
        uses: act10ns/slack@v2
        with:
          status: success
          channel: 'gitaction-pipeline-status-alerting'
          message: 'Terraform Azure AKS deployment completed successfully'

      - name: Slack - Deployment Failed
        if: failure()
        uses: act10ns/slack@v2
        with:
          status: failure
          channel: 'gitaction-pipeline-status-alerting'
          message: 'Terraform deployment failed. Check GitHub Actions logs.'
